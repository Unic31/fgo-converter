name: Auto Update Servant Data

on:
  schedule:
    # 일그오 서번트 실장 시간대에 맞춰 하루 3번 실행 (한국 시간 = UTC + 9)
    # 한국 시간 18:10 (UTC 09:10) - 방송 없는 날 실장
    - cron: '10 9 * * *'
    # 한국 시간 20:10 (UTC 11:10) - 방송 있는 날 실장
    - cron: '10 11 * * *'
    # 한국 시간 00:10 (UTC 15:10) - 신년 캐릭터 실장
    - cron: '10 15 * * *'

  # 수동으로 실행하고 싶을 때 쓰는 버튼 활성화 옵션
  workflow_dispatch:

jobs:
  run-update-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 3. 패키지 설치
        run: npm install

      - name: 4. 스크립트 실행
        run: node updateSvt.js

      - name: 5. 변경된 데이터 자동 커밋 및 푸시
        run: |
          # 깃허브 봇 계정으로 설정
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .

          # 변경사항이 있을 때만 커밋하고 푸시 (에러 방지)
          (git diff --quiet && git diff --staged --quiet) || (git commit -m "Auto-update: 신규 서번트 데이터 및 이미지 추가" && git push)

      - name: 6. 깃허브 페이지 자동 배포 (gh-pages 브랜치)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh-pages 패키지가 인증할 수 있도록 URL에 토큰 추가
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # 배포 스크립트 실행
          npm run deploy
